<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow | Đăng ký</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/colors.css">
    <link rel="stylesheet" href="../styles/components/login.css">
</head>
<body>
    <div class="login-card">
        <!-- Biểu tượng và lời chào -->
        <i class="fas fa-check-circle" style="font-size: 50px; color: var(--primary-color); margin-bottom: 15px;"></i>
        <h2>Chào mừng đến với Task Flow</h2>
        <p>Đăng ký để bắt đầu sử dụng Task Flow</p>

        <!-- Form đăng nhập -->
        <form action="" method="POST">        
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="username" placeholder="Tên đăng nhập" required>
        </div>

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="Email" required>
        </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Mật khẩu" required>
        </div>

        <div class="input-group">
            <i class="fas fa-key"></i>
            <input type="password" id="confirm-password" placeholder="Xác nhận mật khẩu" required>
        </div>

        <button class="register-btn" onclick="">Đăng ký</button>

        <div class="footer-links">
            Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
        </div>

        <span class="divider">hoặc</span>

        <!-- Liên kết tiếp tục dùng thử -->
        <a href="dashboard.html" class="guest-mode"> tiếp tục dùng thử (Khách)</a>
        </form>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Ngô Đức Vương - Dự án IT Portfolio</p>
        </footer>
        
    </div>
</body>
</html>
