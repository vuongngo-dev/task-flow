<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow | Trang Quản Lý</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/colors.css">
    <link rel="stylesheet" href="../styles/components/dashboard.css">
    <script src="../scripts/dashboard.js" defer></script>
    <script src="../scripts/global.js">applyTheme();</script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="menu-toggle" aria-label="Toggle Menu">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="brand">
                    <a href="./dashboard.html">
                        <i class="fas fa-check-circle"></i>
                        Task Flow
                    </a>
                </h2>
            </div>

            <nav class="sidebar-nav">
                
                <a href="./statistics.html" target="content-frame" class="nav-item active" title="Trang chủ">
                    <i class="fas fa-home"></i>
                    <span class="nav-label">Trang chủ</span>
                </a>
                
                <a href="../pages/tasks.html" target="content-frame" class="nav-item" title="Công việc">
                    <i class="fas fa-tasks"></i>
                    <span class="nav-label">Công việc</span>
                </a>
                
                <a href="./pomodoro.html" target="content-frame" class="nav-item" title="Pomodoro">
                    <i class="fas fa-clock"></i>
                    <span class="nav-label">Pomodoro</span>
                </a>

                <a href="./calendar.html" target="content-frame" class="nav-item" title="Lịch">
                    <i class="fas fa-calendar"></i>
                    <span class="nav-label">Lịch</span>
                </a>
                
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="user-profile">
                        <div class="user-avatar">V</div>
                        <div class="sidebar-user-info">
                            <div class="user-name">Ngô Đức Vương</div>
                            <div class="user-role">Admin / Portfolio</div>
                        </div>
                    </div>
                    
                    <div class="user-actions">
                        <button class="action-btn" onclick="window.location.href='./settings.html'" title="Cài đặt hệ thống">
                            <i class="fas fa-cog"></i>
                        </button>
                        <button class="action-btn logout-btn" onclick="window.location.href='../index.html'" title="Đăng xuất">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Overlay mờ khi sidebar mở trên mobile -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <main class="main-content">
            <header class="main-header">
                <!-- Nút hamburger chỉ hiện trên mobile -->
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Mở menu">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>Tổng quan Dashboard</h1>

                <nav class="header-nav">
                    <a href="./notifications.html" target="content-frame" class="nav-item active">
                        <span class="nav-icon"><i class="fas fa-bell"></i></span>
                    </a>
                    <a href="./settings.html" target="_self" class="nav-item">
                        <span class="nav-icon"><i class="fas fa-cog"></i></span>
                    </a>
                </nav>
            </header>

            <div class="dashboard-content">
                <iframe 
                    name="content-frame" 
                    src="./../pages/tasks.html" 
                    frameborder="0" 
                    class="dashboard-iframe"
                    title="Main Content Area">
                </iframe>
            </div>
        </main>

    </div>
</body>

</html>
