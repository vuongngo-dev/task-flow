<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow | Công việc</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/colors.css">
    <link rel="stylesheet" href="../styles/components/tasks.css">
    <script src="../scripts/tasks.js" defer></script>
</head>
<body>
    <div class="page-container">
        <header class="page-header">
            <div>
                <h1>Quản lý công việc</h1>
                <p class="text-muted">Bạn có 3 công việc cần hoàn thành hôm nay.</p>
            </div>
            <button class="btn btn-primary" id="btn-add-task">
                <i class="fas fa-plus"></i>
                Thêm công việc
            </button>
        </header>

        <div class="tasks-toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Tìm kiếm công việc...">
            </div>
            
            <div class="toolbar-actions">
                <select class="form-select" id="filter-status">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="todo">Chưa bắt đầu</option>
                    <option value="in-progress">Đang làm</option>
                    <option value="done">Hoàn thành</option>
                </select>

                <select class="form-select">
                    <option value="all">Mọi độ ưu tiên</option>
                    <option value="high">🔥 Ưu tiên Cao</option>
                    <option value="medium">⚡ Trung bình</option>
                </select>

                <select class="form-select">
                    <option value="newest">Mới nhất</option>
                    <option value="oldest">Cũ nhất</option>
                </select>

                <div class="view-toggles">
                    <button class="view-btn active" title="Dạng danh sách"><i class="fas fa-list"></i></button>
                    <button class="view-btn" title="Dạng lưới"><i class="fas fa-th-large"></i></button>
                </div>
            </div>
        </div>

        <main class="tasks-content tasks-grid">
            <!-- Danh sách công việc được render tự động bởi tasks.js từ localStorage -->
        </main>
    </div>

    <!-- Modal Thêm Công Việc -->
    <div id="task-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Thêm Công Việc Mới</h2>
                <button class="close-modal-btn" id="btn-close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Tiêu đề</label>
                    <input type="text" id="task-title" class="form-input" placeholder="Nhập tên công việc...">
                </div>
                <div class="input-group">
                    <label>Mô tả chi tiết</label>
                    <textarea id="task-desc" class="form-input" rows="3" placeholder="Chi tiết công việc..."></textarea>
                </div>
                <div class="modal-row">
                    <div class="input-group">
                        <label>Độ ưu tiên</label>
                        <select id="task-priority" class="form-select">
                            <option value="high">Cao</option>
                            <option value="medium" selected>Trung bình</option>
                            <option value="low">Thấp</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Ngày hết hạn</label>
                        <input type="date" id="task-date" class="form-input">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="btn-cancel-modal">Hủy</button>
                <button class="btn btn-primary" id="btn-save-task">Lưu công việc</button>
            </div>
        </div>
    </div>
</body>
</html>
